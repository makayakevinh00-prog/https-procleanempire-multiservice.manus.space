<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" width="1080" height="300" role="img" aria-label="Bandeau final de carrousel">
  <title>Bandeau de fin — dernière slide</title>
  <rect x="0" y="0" width="1080" height="300" fill="#0A1A2F"/>
  <text x="72" y="112" font-family="Poppins, Montserrat, sans-serif" font-weight="800" font-size="56" letter-spacing="-1" fill="#FFFFFF">Un doute sur un détail ?</text>
  <text x="72" y="168" font-family="Inter, sans-serif" font-weight="400" font-size="32" fill="#7A8BA0">L'Inspecteur passe le voir.</text>
  <rect x="72" y="204" width="440" height="76" rx="18" fill="#1E6FD8"/>
  <text x="104" y="252" font-family="Poppins, Montserrat, sans-serif" font-weight="600" font-size="28" fill="#FFFFFF">Demander une inspection</text>
</svg>
